name: CI/CD — Lint, Test (>=80% Coverage) & Deploy to Google Cloud

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: wheres-my-bus-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

env:
  GCP_PROJECT_ID: wheres-my-bus-513220
  GCP_REGION: europe-west1
  GAR_IMAGE_REPO: europe-west1-docker.pkg.dev/wheres-my-bus-513220/wheres-my-bus/backend

jobs:
  # ----------------------------------------------------------------------------
  # 1. Frontend Quality Gate: ESLint, TypeScript & Jest (>= 80% Coverage)
  # ----------------------------------------------------------------------------
  webapp-quality:
    name: Webapp — Lint, Typecheck & Tests (>=80% Coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (--max-warnings=0)
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Unit & Integration Tests with >=80% Coverage Gate
        run: npm test

  # ----------------------------------------------------------------------------
  # 2. Backend Quality Gate: ktlint, Detekt, JUnit 5 & Kover (>= 80% Coverage)
  # ----------------------------------------------------------------------------
  backend-quality:
    name: Backend — ktlint, Detekt, Tests & Kover (>=80% Coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup JDK 27
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '27'
          cache: 'gradle'

      - name: Run ktlint, Detekt, Unit/Integration Tests & Kover >=80% Verification
        run: ./gradlew ktlintCheck detekt test koverVerify --no-daemon

  # ----------------------------------------------------------------------------
  # 3. Terraform Quality Gate: Format Check & Schema Validation
  # ----------------------------------------------------------------------------
  terraform-validate:
    name: Terraform — Format & Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.9.8'

      - name: Check Terraform formatting
        run: terraform fmt -check

      - name: Initialize Terraform (backend-less validation)
        run: terraform init -backend=false

      - name: Validate Terraform configuration
        run: terraform validate

  # ----------------------------------------------------------------------------
  # 4. Deploy to Google Cloud (Runs only on main/master after all checks pass)
  # ----------------------------------------------------------------------------
  deploy:
    name: Deploy — Build Image & Terraform Apply (europe-west1)
    runs-on: ubuntu-latest
    needs:
      - webapp-quality
      - backend-quality
      - terraform-validate
    if: >-
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry (europe-west1)
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      - name: Initialize Terraform with GCS Remote State & Ensure Registry + Secret Container
        working-directory: terraform
        run: |
          terraform init
          terraform apply \
            -target=google_project_service.apis \
            -target=google_artifact_registry_repository.repo \
            -target=google_secret_manager_secret.bods_api_key \
            -var="project_id=${{ env.GCP_PROJECT_ID }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -auto-approve

      - name: Build & Push Combined Webapp + Kotlin Backend Image
        run: |
          docker build \
            -t "${{ env.GAR_IMAGE_REPO }}:${{ github.sha }}" \
            -t "${{ env.GAR_IMAGE_REPO }}:latest" \
            .
          docker push "${{ env.GAR_IMAGE_REPO }}:${{ github.sha }}"
          docker push "${{ env.GAR_IMAGE_REPO }}:latest"

      - name: Terraform Apply Full Stack to Google Cloud
        working-directory: terraform
        run: |
          terraform apply \
            -var="project_id=${{ env.GCP_PROJECT_ID }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -var="container_image=${{ env.GAR_IMAGE_REPO }}:${{ github.sha }}" \
            -var="family_pin=${{ secrets.FAMILY_PIN }}" \
            -auto-approve

          SERVICE_URL=$(terraform output -raw cloud_run_service_url)
          echo "### 🚀 Deployed NIBS Route 21 Monitor" >> $GITHUB_STEP_SUMMARY
          echo "- **Cloud Run URL**: ${SERVICE_URL}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ env.GAR_IMAGE_REPO }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
